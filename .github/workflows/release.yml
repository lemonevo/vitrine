name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Check semver format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

  test:
    name: Test
    runs-on: macos-26
    needs: validate-tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Create signing config
        run: cp Prizm/LocalConfig.xcconfig.template Prizm/LocalConfig.xcconfig

      - name: Run tests
        run: |
          xcodebuild test \
            -project "Prizm/Prizm.xcodeproj" \
            -scheme "Prizm" \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

  build-dmg:
    name: Build & Package DMG
    runs-on: macos-26
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Create signing config (unsigned release build)
        run: cp Prizm/LocalConfig.xcconfig.template Prizm/LocalConfig.xcconfig

      - name: Build Release (no signing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project "Prizm/Prizm.xcodeproj" \
            -scheme "Prizm" \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build | xcpretty || exit ${PIPESTATUS[0]}

      - name: Create DMG
        run: |
          APP="build/Build/Products/Release/Prizm.app"
          VERSION="${GITHUB_REF_NAME}"
          DMG_NAME="Prizm-${VERSION}.dmg"

          STAGING="dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/Prizm.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Prizm ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload DMG to GitHub Release (draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ env.DMG_PATH }}
          draft: true
          generate_release_notes: true

      # A step here used to push a rewritten `Casks/prizm.rb` into
      # `b0x42/homebrew-prizm` — the upstream author's tap — using a
      # `TAP_GITHUB_TOKEN` secret. It has been removed.
      #
      # What it would have done on the first `v*` tag: set that cask's `version` to
      # this repository's tag and its `sha256` to this repository's DMG, while the
      # cask's `url` still pointed at `b0x42/prizm`'s releases. Every upstream user's
      # `brew install --cask prizm` would then have failed its checksum, for a
      # release they never asked for. `Casks/prizm.rb` in this repository carries the
      # same warning, and `README.md`'s install section says there is no Vitrine tap.
      #
      # `gh secret list` reports no secrets on this repository, so the guard below
      # would have fired and the step would have exited 0 without pushing. It is
      # removed anyway: the step asserts that this project owns a tap, and the next
      # person to add a token would arm it.
      #
      # A Vitrine tap needs a repository of its own, under this owner, plus a
      # published release here to point at. Neither exists, so there is nothing for
      # this workflow to update.
